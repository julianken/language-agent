# Cloudflare Worker config for the lexercon.com apex router
# (language-router-gateway plan, Task 7). Authored only — never deployed
# by this worktree (HARD CONSTRAINT: zero live-infra mutation, no Worker
# deploy, no Cloudflare API writes). Terraforming this (a
# cloudflare_workers_script + cloudflare_workers_route resource set) is
# Task 8 / Group D, handled separately — this file is what that Terraform
# would point `content` at, and what `wrangler dev`/`wrangler deploy` read
# directly for manual verification in the meantime.

name = "lexercon-router"
main = "router-worker.js"
compatibility_date = "2026-07-01"

# Non-secret backend hostnames (Cloud Run's own run.app hostnames aren't
# sensitive — they're only reachable at all via the shared-secret header
# below). PLACEHOLDERS — the real values are
# trimprefix(module.cloud_run_service["ar"|"zh"].service_uri, "https://")
# (R-D: `service_uri` is a full "https://…" URL; the Worker assigns this
# straight to `target.hostname`, which must be a bare host).
[vars]
LA_AR_HOST = "REPLACE_WITH_LA_AR_RUN_APP_HOST"
LA_ZH_HOST = "REPLACE_WITH_LA_ZH_RUN_APP_HOST"

# SHARED_SECRET_AR / SHARED_SECRET_ZH are deliberately NOT plaintext
# [vars] entries — they're the access-gate credentials the server
# enforces (Task 6b), ONE PER INSTANCE (Group D resolved the Task-7
# mismatch this NOTE used to flag here, by taking option (b): the Worker
# now selects `env["SHARED_SECRET_" + seg.toUpperCase()]` per request —
# see router-worker.js's route() — matching access-gate/main.tf's
# existing distinct-secret-per-instance shape 1:1, never a shared
# value). Set both as Worker secrets, out of band, once this Worker is
# actually deployed (Task 8):
#
#   wrangler secret put SHARED_SECRET_AR
#   wrangler secret put SHARED_SECRET_ZH
#
# infra/worker.tf's cloudflare_worker_script wires these two as
# secret_text_binding blocks reading the SAME two Secret Manager secrets
# (language-agent-ar-shared-secret / language-agent-zh-shared-secret)
# the cloud-run-service module already injects into each backend's own
# SHARED_SECRET env — so the Worker and each backend agree on the same
# per-instance value without this file (or Terraform state outside the
# private GCS backend) ever holding it in plaintext.

# The route this Worker binds to zone-side (Task 8's
# cloudflare_workers_route, not authored here):
#   pattern = "lexercon.com/*"
#   zone_name = "lexercon.com"
