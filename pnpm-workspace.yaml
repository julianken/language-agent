# pnpm workspace globs. All product code lives under src/ (operator layout
# directive 2026-07-02 — see issue #6's amendment; infra/ is reserved for
# #11's Terraform tree). `src/sidecars/` is deliberately NOT listed — it
# stays outside the pnpm workspace entirely (Python, its own per-language
# tooling; see docs/decisions/language-module-architecture.md §5.1).
# Confirmed by `pnpm -r list` not listing src/sidecars/ar or src/sidecars/zh.
packages:
  - "src/packages/*"
  - "src/apps/*"

# pnpm catalog — single-source version pins for deps whose IDENTITY is
# load-bearing across packages (ADR §5.1: "pnpm catalogs pin zod/react/vitest
# so the two lang packages can never drift onto different zod majors — schema
# identity is load-bearing"). Packages reference these as `"zod": "catalog:"`.
# react joins the catalog when a package first depends on it directly.
# vitest joined with @la/lang-conformance (#17): the TCK's dist imports
# `vitest` at test runtime, so the runner instance and the imported API must
# resolve to the same package — exactly the identity-is-load-bearing case.
catalog:
  zod: ^4.4.3
  vitest: ^4.1.9
