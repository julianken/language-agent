# docker-compose profiles (issue #6 established the shape; #7's spec-first
# opening PR filled the `mock` profile — docs/decisions/
# language-module-architecture.md §3.6; issue #19 filled `sidecar-zh`).
# Remaining placeholders: the server image (issue #9) and the ar sidecar
# image (#7's implementation PRs).
#
# Profiles:
#   server      — the Node/TS SSE server (src/apps/server), needed by every leg.
#   sidecar-ar  — the Arabic verification sidecar (build context
#                 src/sidecars/ar; real image lands with #7's implementation
#                 PRs — NOT its spec-first opening PR).
#   sidecar-zh  — the Chinese verification sidecar v0 (build context
#                 src/sidecars/zh; deterministic legs only, issue #19).
#                 Boot it alone with:  docker compose --profile sidecar-zh up
#   mock        — the Prism "null sidecar" serving the hand-authored shared
#                 spec at src/packages/contract/sidecar/openapi.yaml, letting
#                 #9 (hot path) and frontend work proceed with zero Python.
#                 Boot it alone with:  docker compose --profile mock up mock
#                 (the profile also activates `server`, whose image is still
#                 a placeholder until #9).
name: language-agent

services:
  server:
    profiles: ["server", "ar", "zh", "mock"]
    # Placeholder: src/apps/server has no Dockerfile yet. Real build context
    # lands with issue #9 (hot path) / the walking-skeleton deploy child.
    image: "language-agent/server:placeholder"
    environment:
      LANGUAGE: "${LANGUAGE:-fake}"
    ports:
      - "8080:8080"

  sidecar-ar:
    profiles: ["sidecar-ar", "ar"]
    # Placeholder: real image + Dockerfile (build context src/sidecars/ar)
    # land with issue #7's implementation PRs (stage 2 — the FastAPI routes
    # type against src/sidecars/ar/generated/models.py, generated from the
    # shared spec).
    image: "language-agent/sidecar-ar:placeholder"

  sidecar-zh:
    profiles: ["sidecar-zh", "zh"]
    # The real zh verification sidecar v0 (issue #19): deterministic legs
    # only per the dual-instance amendment — torch-free by construction,
    # offline at runtime (all tables baked at build). /readyz reports honest
    # readiness once the data tables + jieba voter are loaded (seconds-scale).
    build: src/sidecars/zh
    image: "language-agent/sidecar-zh:v0"
    ports:
      - "8137:8000"

  mock:
    profiles: ["mock"]
    # The Prism "null sidecar" (ADR §3.6): serves the hand-authored shared
    # OpenAPI document as a mock sidecar on :4010. Prism also VALIDATES
    # inbound requests against the contract, so the engine's outbound
    # requests get contract-checked here too.
    image: "stoplight/prism:5"
    # -m false: the multiprocess fork crashes under docker (upstream Prism
    # issue: `isPrimary` undefined in createMultiProcessPrism); single
    # process is all a mock needs.
    command: "mock -h 0.0.0.0 -p 4010 -m false /contract/openapi.yaml"
    volumes:
      - "./src/packages/contract/sidecar/openapi.yaml:/contract/openapi.yaml:ro"
    ports:
      - "4010:4010"
