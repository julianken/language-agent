# docker-compose profile STUBS only (issue #6). Service definitions are
# placeholders — the real Prism mock service lands with #7's spec-first
# opening PR (docs/decisions/language-module-architecture.md §3.6); real
# sidecar images with #7 (ar) and the zh walking-skeleton child (§ dual-
# instance amendment). This file only establishes the profile shape so #7
# and #19 have somewhere to fill in real `build`/`image` entries.
#
# Profiles:
#   server      — the Node/TS SSE server (apps/server), needed by every leg.
#   sidecar-ar  — the Arabic verification sidecar (real image lands with #7).
#   sidecar-zh  — the Chinese verification sidecar (real image lands later).
#   mock        — the Prism "null sidecar" serving packages/contract's
#                 openapi.yaml once it exists (#7), letting #9 (hot path) and
#                 frontend work proceed with zero Python.
name: language-agent

services:
  server:
    profiles: ["server", "ar", "zh", "mock"]
    # Placeholder: apps/server has no Dockerfile yet. Real build context
    # lands with issue #9 (hot path) / the walking-skeleton deploy child.
    image: "language-agent/server:placeholder"
    environment:
      LANGUAGE: "${LANGUAGE:-fake}"
    ports:
      - "8080:8080"

  sidecar-ar:
    profiles: ["sidecar-ar", "ar"]
    # Placeholder: real image + Dockerfile land with issue #7's opening PR.
    image: "language-agent/sidecar-ar:placeholder"

  sidecar-zh:
    profiles: ["sidecar-zh", "zh"]
    # Placeholder: real image lands with the zh walking-skeleton sidecar
    # child (deterministic-legs-only per the dual-instance amendment).
    image: "language-agent/sidecar-zh:placeholder"

  mock:
    profiles: ["mock"]
    # Placeholder: the real Prism mock (stoplight/prism) serving
    # packages/contract/sidecar/openapi.yaml lands with issue #7's
    # spec-first opening PR — that file does not exist yet.
    image: "stoplight/prism:4"
    command: "mock -h 0.0.0.0 /placeholder-openapi.yaml"
