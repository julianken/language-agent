# docker-compose profiles (issue #6 established the shape; #7's spec-first
# opening PR filled the `mock` profile — docs/decisions/
# language-module-architecture.md §3.6; #7 stage 2 filled `sidecar-ar` with
# the real image). The zh sidecar definition remains a placeholder until
# the zh walking-skeleton child lands (§ dual-instance amendment).
#
# Profiles:
#   server      — the Node/TS SSE server (src/apps/server), needed by every leg.
#   sidecar-ar  — the Arabic verification sidecar (build context
#                 src/sidecars/ar — the REAL image, issue #7 stage 2):
#                 docker compose --profile sidecar-ar up sidecar-ar
#                 serves the gate on :8081 (container :8000).
#   sidecar-zh  — the Chinese verification sidecar (build context
#                 src/sidecars/zh; real image lands later).
#   mock        — the Prism "null sidecar" serving the hand-authored shared
#                 spec at src/packages/contract/sidecar/openapi.yaml, letting
#                 #9 (hot path) and frontend work proceed with zero Python.
#                 Boot it alone with:  docker compose --profile mock up mock
#                 (the profile also activates `server`, whose image is still
#                 a placeholder until #9).
name: language-agent

services:
  server:
    profiles: ["server", "ar", "zh", "mock"]
    # Placeholder: src/apps/server has no Dockerfile yet. Real build context
    # lands with issue #9 (hot path) / the walking-skeleton deploy child.
    image: "language-agent/server:placeholder"
    environment:
      LANGUAGE: "${LANGUAGE:-fake}"
    ports:
      - "8080:8080"

  sidecar-ar:
    profiles: ["sidecar-ar", "ar"]
    # The real Arabic verification sidecar (issue #7 stage 2): FastAPI
    # routes typed against src/sidecars/ar/generated/models.py (generated
    # from the shared spec); dediac-roundtrip + calima-msa-r13
    # analyzer-membership legs; fully offline at runtime (morphology DB
    # baked at build).
    build:
      context: src/sidecars/ar
      target: runtime
    image: "language-agent/sidecar-ar:dev"
    # Hosting ADR (docs/decisions/hosting-walking-skeleton.md): the sidecar
    # container gets 1 GiB — analyzer RSS ≈ 399 MB; 512 MB is too tight
    # with the HTTP layer on top.
    mem_limit: "1g"
    ports:
      - "8081:8000"
    # Mirrors the Cloud Run startup-probe shape (#11): poll /readyz —
    # honest readiness, 200 only once the analyzer DB is loaded (measured
    # warmup ≈ 2 s from container start on the dev host).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  sidecar-zh:
    profiles: ["sidecar-zh", "zh"]
    # Placeholder: real image (build context src/sidecars/zh) lands with the
    # zh walking-skeleton sidecar child (deterministic-legs-only per the
    # dual-instance amendment).
    image: "language-agent/sidecar-zh:placeholder"

  mock:
    profiles: ["mock"]
    # The Prism "null sidecar" (ADR §3.6): serves the hand-authored shared
    # OpenAPI document as a mock sidecar on :4010. Prism also VALIDATES
    # inbound requests against the contract, so the engine's outbound
    # requests get contract-checked here too.
    image: "stoplight/prism:5"
    # -m false: the multiprocess fork crashes under docker (upstream Prism
    # issue: `isPrimary` undefined in createMultiProcessPrism); single
    # process is all a mock needs.
    command: "mock -h 0.0.0.0 -p 4010 -m false /contract/openapi.yaml"
    volumes:
      - "./src/packages/contract/sidecar/openapi.yaml:/contract/openapi.yaml:ro"
    ports:
      - "4010:4010"
