name: ci

# The real build/test CI for application code, alongside (never replacing)
# the pre-existing scaffolding.yml gate. Runs the pnpm workspace's
# install → build → typecheck → boundary gates → test pipeline, plus the
# ADR §2.4 boundary-enforcement gates (dependency-cruiser, the no-`lang===`
# lint/grep gate) so they fire on every PR from the first commit.
#
# ORDER IS LOAD-BEARING: `build` must run BEFORE the dependency-cruiser
# gate. The packages' `exports` maps resolve `@la/*` only to ./dist/*, so
# without a prior build every cross-package import is unresolvable and the
# path-based forbidden rules match nothing (PR #25 review finding 1 — the
# gate was silently inert in the original ordering). Belt two:
# .dependency-cruiser.cjs's `no-unresolvable-la-imports` rule fails loudly
# on any unresolved @la/* import, so a future reordering can't silently
# disarm the gate again.
#
# `build` also runs BEFORE `typecheck` (since #16 gave packages real
# cross-package imports): typecheck resolves `@la/*` through the same
# exports maps to ./dist/*.d.ts, so on a clean checkout it needs the
# topological build first. Build itself typechecks each package's src
# (minus tests); the typecheck step adds the test files on top.
on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Boundary gate — dependency-cruiser (ADR §2.4 rules a–d; requires the build above)
        run: pnpm run boundary:deps

      - name: Boundary gate — no lang===/language=== conditionals (ADR §2.4 mechanism 4)
        run: pnpm run boundary:lang-conditional

      - name: Boundary gate — renderer neutrality (issue #10 ACs; fail-loud greps: no direction/ruby in shell+engine, no engine-side fade interpretation)
        run: pnpm run boundary:renderer-neutrality

      - name: Test
        run: pnpm run test

      # --- Spec-first gates (ADR §3.2; issue #7's spec-first opening PR) ---
      # The hand-authored src/packages/contract/sidecar/openapi.yaml is the
      # single source of truth; every generated artifact is committed, so
      # each gate is: regenerate, then fail on any drift. These run AFTER
      # Build: the annotation-schema generator imports @la/lang-ar's dist/.

      - name: Spec freshness — TS sidecar client + ar annotation schema (regenerate + git diff --exit-code)
        run: |
          pnpm run spec:generate:node
          git diff --exit-code -- \
            src/packages/contract/src/sidecar-client/openapi-types.gen.ts \
            src/packages/lang-ar/ar-annotations.schema.json

      - name: Set up uv (runs the pinned datamodel-code-generator via uvx)
        # Exact tag on purpose: setup-uv publishes no bare `v8` major alias.
        uses: astral-sh/setup-uv@v8.2.0

      - name: Spec freshness — Pydantic v2 models (regenerate + git diff --exit-code)
        # The real command is scripts/generate-sidecar-models.sh — uvx with
        # the exact pin from src/sidecars/ar/codegen/requirements.txt.
        run: |
          pnpm run spec:generate:python
          git diff --exit-code -- src/sidecars/ar/generated

      - name: Spec breaking-change gate — oasdiff (breaking without a major bump fails)
        # checkout@v4 is shallow, so fetch the base branch tip explicitly;
        # the script compares HEAD's spec against it (oasdiff via the pinned
        # tufin/oasdiff docker image).
        run: |
          git fetch --depth=1 origin main
          BASE_REF=FETCH_HEAD bash scripts/check-openapi-breaking.sh

  # The Arabic verification sidecar (issue #7 stage 2). Build-time network
  # only (wheels + the morphology DB); every RUNTIME step below executes
  # under `--network none` — that is the offline-at-runtime AC, asserted on
  # every PR, not once. The shared contract artifacts are mounted read-only
  # (they live outside the docker build context on purpose: the
  # implementation types against the contract, it never carries it).
  sidecar-ar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the pruned runtime image (hosting-ADR shape)
        run: docker build --target runtime -t language-agent/sidecar-ar:ci src/sidecars/ar

      - name: Build the test image (runtime + locked dev deps + suite)
        run: docker build --target test -t language-agent/sidecar-ar:ci-test src/sidecars/ar

      - name: ADR consistency probe — size / cold load / RSS (informational; >2x deviation is an ADR-amendment finding)
        run: |
          docker image inspect language-agent/sidecar-ar:ci --format 'runtime image size: {{.Size}} bytes (ADR: 553 MB)'
          docker run --rm --network none language-agent/sidecar-ar:ci python -m app.probe

      - name: Prune regression — the ADR prune list must stay out of the runtime image
        run: |
          docker run --rm --network none language-agent/sidecar-ar:ci python - <<'PY'
          import importlib.util, sys
          pruned = ["torch", "triton", "transformers", "sympy", "sklearn", "pandas"]
          present = [m for m in pruned if importlib.util.find_spec(m) is not None]
          sys.exit(f"prune regression: {present}" if present else 0)
          PY

      - name: Golden fixtures + conformance suite — OFFLINE (--network none)
        run: |
          docker run --rm --network none \
            -v "$PWD/src/packages/contract/sidecar/openapi.yaml:/contract/openapi.yaml:ro" \
            -v "$PWD/src/packages/lang-ar/ar-annotations.schema.json:/contract/ar-annotations.schema.json:ro" \
            language-agent/sidecar-ar:ci-test python -m pytest -q tests

      - name: Schemathesis vs the unchanged shared spec — OFFLINE (--network none)
        run: |
          docker run --rm --network none \
            -v "$PWD/src/packages/contract/sidecar/openapi.yaml:/contract/openapi.yaml:ro" \
            language-agent/sidecar-ar:ci-test bash tests/run-schemathesis.sh

      # --- issue #8 seed-vocab gate: every @la/lang-ar seed entry MUST band
      # GREEN through the REAL sidecar's POST /v1/verify (never the Prism
      # mock, never a direct camel-tools call — issue #8 AC2's
      # mock-exclusion clause). This needs the CI-built runtime image
      # actually SERVING traffic (network on, unlike the offline steps
      # above), so it runs as its own boot/validate/teardown trio.
      - name: Boot the ar sidecar image — issue #8 seed-vocab validation
        run: |
          docker run -d --name sidecar-ar-seedvocab -p 8081:8000 language-agent/sidecar-ar:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/readyz >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "sidecar never became ready"; docker logs sidecar-ar-seedvocab; exit 1

      - name: Set up Node (seed-vocab validation script only — no pnpm install needed, this job otherwise stays docker-only)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate @la/lang-ar seed vocab — every entry GREEN through POST /v1/verify (issue #8 AC2)
        run: node src/packages/lang-ar/scripts/validate-seed-vocab.mjs
        env:
          SIDECAR_AR_BASE_URL: http://127.0.0.1:8081
          SIDECAR_AR_SKIP_BOOT: "1"

      - name: Stop the seed-vocab validation container
        if: always()
        run: docker rm -f sidecar-ar-seedvocab

  # --- zh verification sidecar v0 (issue #19) — deterministic legs only. ---
  # Independent of the pnpm workspace build: the sidecar sits outside the
  # workspace globs (Python, own pinned deps). Gates, in order: model + baked-
  # lexicon freshness, unit + golden-fixture tests (incl. the fail-closed
  # negative paths), image build, the torch-free regression assertion,
  # Schemathesis conformance against the UNCHANGED shared spec (the
  # cross-consumer proof no ar-specific shape entered the document — AC moved
  # from #7), and the offline-at-runtime check (--network=none).
  sidecar-zh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv (pinned codegen + schemathesis via uvx)
        # Exact tag on purpose: setup-uv publishes no bare `v8` major alias.
        uses: astral-sh/setup-uv@v8.2.0

      - name: Spec freshness — zh Pydantic models (regenerate + git diff --exit-code)
        run: |
          bash scripts/generate-sidecar-models.sh
          git diff --exit-code -- src/sidecars/zh/generated

      - name: Lexicon freshness — baked sliver lexicon regenerated from @la/lang-zh/assets
        # When #20 replaces the curation stub wholesale, this gate forces the
        # baked lexicon to rebuild against the real asset.
        run: |
          python3 src/sidecars/zh/scripts/build_lexicon.py
          git diff --exit-code -- src/sidecars/zh/data/lexicon.json

      - name: Unit + golden HTTP fixture tests (fail-closed negative paths included)
        working-directory: src/sidecars/zh
        run: |
          uv venv .venv -p 3.12
          uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt
          .venv/bin/python -m pytest -q

      - name: Build the sidecar image
        run: docker build -t language-agent/sidecar-zh:ci src/sidecars/zh

      - name: Torch-free regression gate (image half)
        run: bash src/sidecars/zh/scripts/assert-deterministic-only.sh language-agent/sidecar-zh:ci

      - name: Boot the image and wait for honest readiness
        run: |
          docker run -d --name sidecar-zh -p 8137:8000 language-agent/sidecar-zh:ci
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8137/readyz >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "sidecar never became ready"; docker logs sidecar-zh; exit 1

      - name: Schemathesis conformance — built image vs the UNCHANGED shared spec
        run: >
          uvx schemathesis@4.22.3 run src/packages/contract/sidecar/openapi.yaml
          --url http://127.0.0.1:8137 --checks all --max-examples 200

      - name: Offline at runtime — full endpoint surface with network disabled
        run: |
          docker rm -f sidecar-zh
          docker run -d --name sidecar-zh-offline --network=none language-agent/sidecar-zh:ci
          docker exec sidecar-zh-offline python scripts/offline_smoke.py

  # The TCK drop-in matrix (ADR §4.3; issue #17): the same workflow
  # definition and the same conformance suite per language leg. The ADR's
  # conceptual matrix is `[fake, ar, zh]` (all three ride the one shared
  # contract); this job realizes it as a SINGLE-SOURCED LIVE-SET so a
  # not-yet-live leg is NEUTRAL BY ABSENCE, never a neutralized-but-red X.
  # Runs on every PR, never a one-time certification.
  #
  # LIVE-SET MECHANISM (supersedes the earlier continue-on-error scheme):
  #   - The matrix `lang:` array below IS the live-set — the single source
  #     of which legs run. Only a leg listed there exists as a check; a
  #     not-yet-live leg produces NO `conformance (<lang>)` check at all,
  #     so it can neither red the commit nor deadlock the merge queue.
  #     (The old `continue-on-error: ${{ matrix.lang != 'fake' }}` left
  #     `ar`/`zh` RUNNING and FAILING — a red X on every merge commit that
  #     trained everyone to ignore red. Absent is unambiguous; it's gone.)
  #   - `conformance (fake)` is live today and is the ONLY leg currently
  #     eligible to be a REQUIRED status check — fully deterministic,
  #     dependency-free, green (#17's done-criterion). No live leg carries
  #     `continue-on-error`: a live leg that goes red MUST block, not
  #     neutralize.
  #   - NOT-YET-LIVE legs, absent from the live-set until their pack lands:
  #       ar → LIVE as of issue #9 (completes #7/#9)
  #       zh → flip in #21 (completes with #19/#21; the zh leg then runs
  #            the real deterministic-legs v0 image directly, like ar, with
  #            NO `SIDECAR_MODEL_MODE=fixture` — that flag stays dormant for
  #            zh v0 and activates only with #22/N4's neural legs).
  #   - TO FLIP A LEG LIVE (one-line edit + two registrations, all in the
  #     flipping PR): (1) add the lang to the `lang:` live-set below, so its
  #     leg RUNS and must be green — there is no continue-on-error to drop;
  #     (2) add `conformance (<lang>)` to the branch-ruleset required checks;
  #     (3) uncomment its `check-success` line in .mergify.yml. Issue #9 did
  #     (1) and (3) here; (2) — the branch-ruleset required-check edit — is a
  #     repo-settings change the orchestrator does at merge (see the PR body).
  #
  # Each live leg also runs the shared E2E turn script (issue #9: learner
  # message → generate → gate → anglicize → tutor-message, zero live LLM
  # calls — @la/server's ReplayCandidateGenerator) alongside the TCK; the
  # `ar` leg additionally boots the REAL src/sidecars/ar image first (never
  # mocked — the same real, deterministic, non-neural service #7 ships) so
  # both the TCK's gate calls and the E2E script's gate calls hit it for
  # real. Schemathesis + probeSidecar golden HTTP probes (ADR §4.3 item 3)
  # remain a follow-up — not part of this issue's scope.
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # THE LIVE-SET (single source): only legs listed here run as checks.
        # zh flips live in #21. Flip = add the lang here (+ ruleset required
        # check + .mergify.yml).
        lang: [fake, ar]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (exports maps resolve @la/* to dist/ — see the build job)
        run: pnpm run build

      # ar leg only: boot the REAL sidecar (never mocked — issue #8's
      # mock-exclusion precedent extended to the TCK + E2E turn script).
      # Needed before BOTH the TCK leg and the E2E turn script below, since
      # `@la/lang-ar`'s gate is wired through the generated sidecar client
      # only (no bespoke fetch, no Prism substitute at this point).
      - name: Boot the ar sidecar (ar leg only)
        if: matrix.lang == 'ar'
        run: |
          docker build --target runtime -t language-agent/sidecar-ar:conformance-ci src/sidecars/ar
          docker run -d --name sidecar-ar-conformance -p 8081:8000 language-agent/sidecar-ar:conformance-ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/readyz >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "sidecar never became ready"; docker logs sidecar-ar-conformance; exit 1

      - name: TCK leg — @la/lang-${{ matrix.lang }}
        run: bash scripts/conformance-leg.sh "${{ matrix.lang }}"
        env:
          # Harmless on the fake leg (never read there); real value on ar.
          SIDECAR_AR_BASE_URL: ${{ matrix.lang == 'ar' && 'http://127.0.0.1:8081' || '' }}

      # The shared E2E turn script (issue #9, step 8): same test body, same
      # file, every leg — the fake assertions always run; the ar-only
      # assertions self-skip unless SIDECAR_AR_BASE_URL is set (this step
      # sets it only on the ar leg, matching this job's live-set).
      - name: E2E turn script — @la/server (zero live LLM calls; ar leg's gate is the real sidecar booted above)
        run: pnpm --filter @la/server run test:e2e-turn
        env:
          SIDECAR_AR_BASE_URL: ${{ matrix.lang == 'ar' && 'http://127.0.0.1:8081' || '' }}

      - name: Stop the ar sidecar (ar leg only)
        if: always() && matrix.lang == 'ar'
        run: docker rm -f sidecar-ar-conformance || true

  # Real-browser e2e for the walking-skeleton renderer (issue #10): SSE
  # streams progressively, tokens clickable, learning-event echo verified,
  # RTL sanity + the ḥarakāt clipping probe against the pinned Amiri build.
  # Separate job so a browser-install hiccup never masks a build/gate
  # failure (and vice versa).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (tsc dists — the exports maps resolve @la/* to dist/*)
        run: pnpm run build

      - name: Build the site (vite)
        run: pnpm --filter @la/web run build:site

      - name: Install Playwright Chromium
        run: pnpm --filter @la/web exec playwright install --with-deps chromium

      - name: Playwright e2e
        run: pnpm --filter @la/web run test:e2e
