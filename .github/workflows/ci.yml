name: ci

# The real build/test CI for application code, alongside (never replacing)
# the pre-existing scaffolding.yml gate. Runs the pnpm workspace's
# install → build → typecheck → boundary gates → test pipeline, plus the
# ADR §2.4 boundary-enforcement gates (dependency-cruiser, the no-`lang===`
# lint/grep gate) so they fire on every PR from the first commit.
#
# ORDER IS LOAD-BEARING: `build` must run BEFORE the dependency-cruiser
# gate. The packages' `exports` maps resolve `@la/*` only to ./dist/*, so
# without a prior build every cross-package import is unresolvable and the
# path-based forbidden rules match nothing (PR #25 review finding 1 — the
# gate was silently inert in the original ordering). Belt two:
# .dependency-cruiser.cjs's `no-unresolvable-la-imports` rule fails loudly
# on any unresolved @la/* import, so a future reordering can't silently
# disarm the gate again.
#
# `build` also runs BEFORE `typecheck` (since #16 gave packages real
# cross-package imports): typecheck resolves `@la/*` through the same
# exports maps to ./dist/*.d.ts, so on a clean checkout it needs the
# topological build first. Build itself typechecks each package's src
# (minus tests); the typecheck step adds the test files on top.
on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Boundary gate — dependency-cruiser (ADR §2.4 rules a–d; requires the build above)
        run: pnpm run boundary:deps

      - name: Boundary gate — no lang===/language=== conditionals (ADR §2.4 mechanism 4)
        run: pnpm run boundary:lang-conditional

      - name: Test
        run: pnpm run test
