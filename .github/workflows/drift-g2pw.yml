name: drift-g2pw

# Scheduled NON-BLOCKING drift detector (a) of ADR §4.3's scheduled-jobs
# list, wired per the dual-instance amendment Decision 5 (issue #17 lands
# the skeleton): run the REAL g2pW image (torch in CI ONLY — never in a
# deployed image) over the zh curation corpus + logged generated turns and
# diff against the pinned readings and the C9 context table.
#
# ACTIVE since #20 (Chinese seed sliver) landed: #20 owns the curation-
# toolchain container (src/sidecars/zh/curation/ — the only thing allowed
# to run g2pW/HanLP; NEVER deployed) and the recorded curation baseline
# (src/sidecars/zh/curation/baseline/g2pw-drift-baseline.json). This job
# builds that container and re-runs real g2pW over the curation corpus +
# every C9 carrier sentence, diffing per-position against the baseline
# (tools/gate_g2pw.py --check). Logged generated turns join the corpus
# once a deployed system produces them (none exist yet — pre-deploy).
# N4 does NOT enable this job; it inherits the baseline as its acceptance
# floor.
#
# Deliberately OFF the PR-blocking path (schedule + manual dispatch only):
# its nondeterminism and cost must never gate PRs; it is alarmed so
# fixture rot is visible, not so merges stop.

on:
  schedule:
    - cron: "17 5 * * 1" # weekly (Mon 05:17 UTC); drift detector, not a PR gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-g2pw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g2pw-corpus-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Gate on the curation baseline (#20)
        id: gate
        run: |
          if [ -f "src/sidecars/zh/curation/baseline/g2pw-drift-baseline.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::zh curation baseline found — running the real-g2pW corpus diff."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No zh curation baseline (src/sidecars/zh/curation/baseline absent). Skipping green."
          fi

      - name: Build the curation-toolchain container (torch in CI only — never deployed)
        if: steps.gate.outputs.present == 'true'
        run: docker build -t language-agent/curation-zh:ci src/sidecars/zh/curation

      - name: Real-g2pW corpus diff against the curation baseline
        if: steps.gate.outputs.present == 'true'
        # Re-runs real g2pW (G2PWModel-v2-onnx, downloaded at run time) over
        # the curation corpus + every C9 carrier and diffs the per-position
        # reading fingerprint against the committed baseline. Exit 1 = drift
        # (readings or the C9 context table no longer match what curation
        # verified) — this job is non-blocking by construction (schedule +
        # manual dispatch only; never a PR gate), so a red run is the alarm.
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            language-agent/curation-zh:ci \
            python3 src/sidecars/zh/curation/tools/gate_g2pw.py \
              --check src/sidecars/zh/curation/baseline/g2pw-drift-baseline.json
