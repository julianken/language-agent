:root{
  --canvas:#fbf9f4; --surface-card:#ffffff; --hairline:#e4ddcd;
  --ink:#1a1612; --muted:#8a8275; --primary:#0f766e; --accent-gold:#b8860b;
  --status-learning-bg:#dcebe8;
  --dur-fast:120ms; --dur-base:200ms; --ease-standard:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--canvas); color:var(--ink);
  font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100%; display:flex; flex-direction:column;
}
.gateway{flex:1 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:56px; padding:80px 24px; text-align:center;}
.brand{display:flex; flex-direction:column; align-items:center; gap:14px; opacity:0; animation:rise var(--dur-base) var(--ease-standard) 40ms forwards;}
.wordmark{font-family:"Inter",sans-serif; font-weight:600; font-size:40px; line-height:1.1; letter-spacing:-0.015em; color:var(--ink); margin:0;}
.flourish{display:flex; align-items:center; gap:10px;}
.flourish .rule{width:38px; height:1px; background:var(--accent-gold); opacity:.55;}
.flourish .diamond{width:5px; height:5px; background:var(--accent-gold); transform:rotate(45deg); opacity:.8;}
.tagline{font-family:"Inter",sans-serif; font-weight:400; font-size:16px; line-height:1.55; color:var(--muted); margin:0; max-width:34ch;}
.cards{display:grid; grid-template-columns:repeat(2,minmax(0,220px)); gap:32px; width:100%; max-width:520px; justify-content:center;}
.card{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  aspect-ratio:5/6; padding:32px 20px; background:var(--surface-card);
  border:1px solid var(--hairline); border-radius:16px; text-decoration:none; color:var(--ink); cursor:pointer;
  transition:border-color var(--dur-fast) var(--ease-standard), background var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
  opacity:0; animation:rise var(--dur-base) var(--ease-standard) forwards;
}
.card:nth-child(1){animation-delay:120ms;} .card:nth-child(2){animation-delay:190ms;}
.card:hover,.card:focus-visible{border-color:var(--primary); background:var(--status-learning-bg); transform:translateY(-3px);}
.card:focus-visible{outline:2px solid var(--primary); outline-offset:3px;}
.card:active{transform:translateY(-1px);}
.script{color:var(--ink); line-height:1.2;}
.script-ar{font-family:"Amiri",serif; font-size:44px; direction:rtl; unicode-bidi:isolate;}
.script-zh{font-family:"Noto Serif TC","Songti TC",serif; font-size:40px;}
.name{font-family:"Inter",sans-serif; font-weight:600; font-size:12px; line-height:1.4; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted);}
.card:hover .name,.card:focus-visible .name{color:var(--primary);}
@keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@media (max-width:560px){.cards{grid-template-columns:1fr; max-width:300px;} .gateway{gap:44px;}}
@media (prefers-reduced-motion:reduce){
  .brand,.card{animation:none; opacity:1;}
  .card{transition:border-color var(--dur-fast) linear, background var(--dur-fast) linear;}
  .card:hover,.card:focus-visible{transform:none;}
}
</style>
</head>
<body>
<main class="gateway">
  <div class="brand">
    <div class="flourish" aria-hidden="true"><span class="rule"></span><span class="diamond"></span><span class="rule"></span></div>
    <h1 class="wordmark">lexercon</h1>
    <p class="tagline">a quiet way to read a new language</p>
  </div>
  <nav class="cards" aria-label="Choose a language">
    <a class="card" href="/ar/" lang="ar" hreflang="ar"><span class="script script-ar" dir="rtl">العربية</span><span class="name">Arabic</span></a>
    <a class="card" href="/zh/" lang="zh-Hant" hreflang="zh-Hant"><span class="script script-zh">中文</span><span class="name">Chinese</span></a>
  </nav>
</main>
</body>
</html>
